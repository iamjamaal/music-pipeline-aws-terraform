# ============================================================
# Workflow: Terraform Plan & Apply
# ============================================================
# This workflow handles all infrastructure changes.  The design
# philosophy is "plan on every PR, apply only on merge to main".
#
# HOW IT WORKS
# ─────────────
# Pull Request  →  terraform plan runs and posts a summary as a
#                  PR comment so reviewers can see exactly what
#                  AWS resources will change before approving.
#
# Merge to main →  terraform apply runs automatically, so infra
#                  and code changes land together in one atomic step.
#
# SECRETS REQUIRED (set in GitHub → Settings → Secrets)
#   AWS_ACCESS_KEY_ID      – IAM key for the CI/CD deployment user
#   AWS_SECRET_ACCESS_KEY  – matching secret
#   AWS_REGION             – e.g. us-east-1
#
# The CI/CD IAM user needs these AWS-managed policies:
#   AmazonS3FullAccess, AmazonDynamoDBFullAccess,
#   AWSGlueServiceRole, AWSStepFunctionsFullAccess,
#   IAMFullAccess, CloudWatchLogsFullAccess

name: "Terraform Plan & Apply"

on:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

# Prevent two applies from running simultaneously and corrupting state
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-progress apply

env:
  TF_VERSION:   "1.7.5"
  AWS_REGION:   ${{ secrets.AWS_REGION }}
  ENVIRONMENT:  ${{ github.ref == 'refs/heads/main' && 'dev' || 'dev' }}
  # Override ENVIRONMENT per branch in a multi-env setup:
  #   main → dev, release/* → staging, tags/v* → prod

permissions:
  id-token:       write   # needed for OIDC (optional, see below)
  contents:       read
  pull-requests:  write   # allows posting plan output as PR comment

jobs:
  # ── Job 1: Lint & Validate ─────────────────────────────
  lint:
    name: "Lint & Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: terraform
        # Don't fail the workflow here – just flag it.  The apply job
        # will still run, but the fmt failure appears in the PR summary.
        continue-on-error: true

      - name: Terraform Init (validate only)
        run: |
          terraform init \
            -backend=false \
            -input=false
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: terraform

  # ── Job 2: Plan ────────────────────────────────────────
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      # Pass the exit code so the apply job knows if there are changes
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:      ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:             ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="region=${{ env.AWS_REGION }}"
        working-directory: terraform

      - name: Terraform Plan
        id: plan
        # -detailed-exitcode:  0=no changes  1=error  2=changes pending
        run: |
          terraform plan \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -detailed-exitcode \
            -no-color \
            -out=tfplan \
            2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        working-directory: terraform
        continue-on-error: true   # capture the exit code; evaluate below

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 3

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            const MAX  = 65000;
            const body = plan.length > MAX
              ? plan.substring(0, MAX) + '\n\n... [truncated – see Actions log for full output]'
              : plan;

            const comment = `### Terraform Plan – \`${{ env.ENVIRONMENT }}\`
            \`\`\`hcl
            ${body}
            \`\`\`
            *Triggered by @${{ github.actor }} on \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body:         comment,
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "Terraform plan failed with an error.  See log above."
          exit 1

  # ── Job 3: Apply ───────────────────────────────────────
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: plan
    # Only apply on pushes to main; skip if there are no changes
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'   &&
      needs.plan.outputs.plan_exit_code == '2'
    environment: ${{ env.ENVIRONMENT }}   # requires manual approval in prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:      ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:             ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="region=${{ env.AWS_REGION }}"
        working-directory: terraform

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan
        working-directory: terraform

      - name: Capture outputs
        id: outputs
        run: |
          terraform output -json > tf_outputs.json
          cat tf_outputs.json
        working-directory: terraform

      - name: Upload Terraform outputs
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs-${{ github.sha }}
          path: terraform/tf_outputs.json
          retention-days: 30
