# ============================================================
# Workflow: Integration Tests
# ============================================================
# Runs after every successful script deployment to verify that
# the pipeline can execute end-to-end against the dev environment
# using the sample data files (songs.csv, streams1.csv, users.csv).
#
# Test strategy
# ─────────────
# Rather than mocking AWS services (which would hide real IAM /
# S3 / DynamoDB integration bugs), we run against actual AWS dev
# resources and then clean up test data afterwards.
#
# The test uploads a small sample CSV, starts a Step Functions
# execution, polls for completion, then queries DynamoDB to
# confirm that at least one KPI item was written.
#
# This is intentionally a "smoke test" – it validates the happy
# path end-to-end.  Unit tests for the transformation logic live
# in tests/unit/ and run on every PR (see the lint job above).

name: "Integration Tests"

on:
  workflow_run:
    workflows: ["Deploy Glue Scripts"]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"

env:
  AWS_REGION:  ${{ secrets.AWS_REGION }}
  ENVIRONMENT: "dev"

permissions:
  contents: read

jobs:
  integration:
    name: "End-to-End Smoke Test"
    runs-on: ubuntu-latest
    # Only run if the trigger workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:      ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:             ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install boto3 pytest

      - name: Resolve resource names from AWS
        id: resources
        run: |
          RAW_BUCKET=$(aws s3 ls | grep "music-pipeline-raw-${{ env.ENVIRONMENT }}" | awk '{print $3}')
          SFN_ARN=$(aws stepfunctions list-state-machines \
            --query "stateMachines[?contains(name, 'music-pipeline-${{ env.ENVIRONMENT }}')].stateMachineArn" \
            --output text)
          GENRE_TABLE="music-pipeline-${{ env.ENVIRONMENT }}-genre-kpis"
          echo "raw_bucket=${RAW_BUCKET}"     >> $GITHUB_OUTPUT
          echo "sfn_arn=${SFN_ARN}"           >> $GITHUB_OUTPUT
          echo "genre_table=${GENRE_TABLE}"   >> $GITHUB_OUTPUT

      - name: Upload sample stream file
        id: upload
        run: |
          TEST_KEY="streams/test_integration_${{ github.run_id }}.csv"
          # Use a small 100-row sample to keep the smoke test fast
          head -101 streams1.csv > /tmp/test_stream.csv
          aws s3 cp /tmp/test_stream.csv \
            s3://${{ steps.resources.outputs.raw_bucket }}/${TEST_KEY} \
            --sse AES256
          echo "test_key=${TEST_KEY}" >> $GITHUB_OUTPUT
          echo "Uploaded test file: ${TEST_KEY}"

      - name: Start Step Functions execution
        id: execution
        run: |
          EXEC_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "${{ steps.resources.outputs.sfn_arn }}" \
            --name "ci-smoke-${{ github.run_id }}" \
            --input '{
              "raw_bucket":        "${{ steps.resources.outputs.raw_bucket }}",
              "file_key":          "${{ steps.upload.outputs.test_key }}",
              "archive_bucket":    "'"$(aws s3 ls | grep music-pipeline-archive-${{ env.ENVIRONMENT }} | awk '{print $3}')"'",
              "validate_job_name": "music-pipeline-validate-${{ env.ENVIRONMENT }}",
              "transform_job_name":"music-pipeline-transform-${{ env.ENVIRONMENT }}",
              "ingest_job_name":   "music-pipeline-ingest-${{ env.ENVIRONMENT }}",
              "archive_job_name":  "music-pipeline-archive-${{ env.ENVIRONMENT }}",
              "genre_kpis_table":  "${{ steps.resources.outputs.genre_table }}",
              "top_songs_table":   "music-pipeline-${{ env.ENVIRONMENT }}-top-songs",
              "top_genres_table":  "music-pipeline-${{ env.ENVIRONMENT }}-top-genres",
              "sns_topic_arn":     "arn:aws:sns:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:music-pipeline-alerts-${{ env.ENVIRONMENT }}"
            }' \
            --query "executionArn" --output text)
          echo "execution_arn=${EXEC_ARN}" >> $GITHUB_OUTPUT
          echo "Started execution: ${EXEC_ARN}"

      - name: Poll execution until complete (max 15 min)
        run: |
          python scripts/poll_execution.py \
            --execution-arn "${{ steps.execution.outputs.execution_arn }}" \
            --timeout-minutes 15 \
            --poll-interval-seconds 30

      - name: Assert DynamoDB KPI was written
        run: |
          python scripts/assert_dynamo.py \
            --table "${{ steps.resources.outputs.genre_table }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Summarise test results
        if: always()
        run: |
          echo "### Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution ARN:** ${{ steps.execution.outputs.execution_arn }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
